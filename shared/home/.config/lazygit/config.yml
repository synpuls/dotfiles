gui:
  # windowSize: "half"
  showFileTree: true
  sidePanelWidth: 0.16
  mainPanelSplitMode: "vertical"
  theme:
    selectedLineBgColor:
      - reverse
  # splitDiff: always
  authorColors:
    'synpuls': 'red'
    '*': 'blue'
  mouseEvents: false
  commitLength:
    show: false
git:
  diffRenderers:
    - colorArg: always
      command: delta --paging=never
quitOnTopLevelReturn: true
